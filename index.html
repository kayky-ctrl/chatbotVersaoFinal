<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robô Gigante Neo-Futurista</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary-color: #ffffff;
      --secondary-color: #ffffff;
      --accent-color: #c678ff;
      --dark-color: #3a2c1a;
      --metal-dark: #2a2a2a;
      --metal-light: #4a4a4a;
      --glow-intensity: 1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 30%, #4a3a2a 0%, var(--dark-color) 50%),
        linear-gradient(to bottom, #2a2218 0%, var(--dark-color) 100%);
      font-family: 'Orbitron', 'Rajdhani', sans-serif;
      overflow: hidden;
      perspective: 1000px;
      cursor: none;
    }

    .custom-cursor {
      position: fixed;
      width: 30px;
      height: 30px;
      border: 2px solid var(--primary-color);
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: difference;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease-out, width 0.3s, height 0.3s;
    }

    .custom-cursor::before {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--primary-color);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    body:hover .custom-cursor {
      width: 40px;
      height: 40px;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      background: var(--primary-color);
      border-radius: 50%;
      opacity: 0.6;
      animation: float 15s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.6;
      }

      90% {
        opacity: 0.6;
      }

      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .robot-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .robot-visor {
      width: 100%;
      height: 100%;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(156, 39, 176, 0.1)),
        radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
    }

    .robot-visor::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(to bottom right,
          rgba(255, 255, 255, 0.3) 0%,
          rgba(255, 255, 255, 0) 70%);
      transform: rotate(30deg);
      animation: shine 6s infinite linear;
      opacity: 0.3;
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%) translateY(-50%) rotate(30deg);
      }

      100% {
        transform: translateX(100%) translateY(50%) rotate(30deg);
      }
    }

    .circuit-pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
    }

    .eyes-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15vw;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .eye {
      width: 25vw;
      height: 25vw;
      max-width: 300px;
      max-height: 300px;
      min-width: 150px;
      min-height: 150px;
      background: radial-gradient(circle at 30% 30%,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(255, 255, 255, 0.7) 50%,
          rgba(255, 255, 255, 0.4) 100%);
      border-radius: 50%;
      box-shadow:
        0 0 100px rgba(255, 255, 255, 0.8),
        inset 0 0 50px rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
    }

.eye-pupil {
      position: absolute;
      width: 45%;
      height: 45%;
      background: 
        radial-gradient(circle at 30% 30%, 
          rgba(198, 120, 255, 0.95) 0%,
          rgba(156, 39, 176, 0.9) 50%,
          rgba(80, 0, 120, 0.9) 100%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      animation: naturalBlink 4s infinite; /* Intervalo entre piscadas reduzido (era 8s) */
      box-shadow:
        0 0 50px rgba(198, 120, 255, 0.8),
        0 0 100px rgba(156, 39, 176, 0.6),
        inset 0 0 30px rgba(255, 255, 255, 0.7);
      filter: blur(0.5px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      transform-origin: center top;
    }

    @keyframes naturalBlink {
      0%, 70%, 85%, 100% {  /* Piscada mais lenta (mais frames de animação) */
        height: 45%;
        transform: translate(-50%, -50%) scaleY(1);
      }
      72% {
        height: 3%;
        transform: translate(-50%, -50%) scaleY(0.07);
      }
      75% {
        height: 10%;
        transform: translate(-50%, -50%) scaleY(0.2);
      }
      80% {
        height: 45%;
        transform: translate(-50%, -50%) scaleY(1);
      }
    }

    /* PÁLPEBRA SUPERIOR - Versão com piscada mais lenta */
    .eye::after {
      content: '';
      position: absolute;
      top: -5%;
      left: 0;
      width: 100%;
      height: 110%;
      background: 
        radial-gradient(ellipse at center top, 
          rgba(30, 10, 50, 0.9) 0%, 
          rgba(30, 10, 50, 0.7) 30%,
          transparent 70%);
      border-radius: 50% 50% 45% 45% / 30% 30% 70% 70%;
      z-index: 25;
      animation: 
        eyelidBlink 4s infinite, /* Sincronizado com o pupil */
        eyelidMovement 12s infinite ease-in-out;
      transform-origin: center top;
      box-shadow: 
        inset 0 -10px 20px rgba(0, 0, 0, 0.5),
        0 5px 15px rgba(0, 0, 0, 0.3);
      border-top: 2px solid rgba(100, 50, 150, 0.5);
    }

    @keyframes eyelidBlink {
      0%, 70%, 85%, 100% {  /* Piscada mais lenta e suave */
        transform: scaleY(1);
        height: 110%;
        top: -5%;
        opacity: 0.3;
      }
      72% {
        transform: scaleY(0.05);
        height: 50%;
        top: 25%;
        opacity: 0.8;
      }
      75% {
        transform: scaleY(0.2);
        height: 80%;
        top: 10%;
        opacity: 0.6;
      }
      80% {
        transform: scaleY(1);
        height: 110%;
        top: -5%;
        opacity: 0.3;
      }
    }

    /* PÁLPEBRA INFERIOR - Versão mais rápida */
    .eye::before {
      content: '';
      position: absolute;
      bottom: -5%;
      left: 0;
      width: 100%;
      height: 110%;
      background:
        radial-gradient(ellipse at center bottom,
          rgba(30, 10, 50, 0.6) 0%,
          transparent 70%);
      border-radius: 45% 45% 50% 50% / 70% 70% 30% 30%;
      z-index: 25;
      animation:
        lowerEyelidMovement 8s infinite ease-in-out;
      /* Reduzi de 12s para 8s */
      transform-origin: center bottom;
      box-shadow:
        inset 0 10px 20px rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(100, 50, 150, 0.3);
    }

    @keyframes lowerEyelidMovement {

      0%,
      100% {
        transform: scaleY(1) rotate(0deg);
      }

      30% {
        transform: scaleY(0.98) rotate(-0.3deg);
      }

      50% {
        transform: scaleY(1.01) rotate(0.2deg);
      }

      70% {
        transform: scaleY(0.99) rotate(-0.1deg);
      }
    }

    /* PÁLPEBRA LATERAL - Para movimento mais orgânico */
    .eye-lid {
      position: absolute;
      width: 110%;
      height: 110%;
      border-radius: 50%;
      z-index: 24;
    }

    .eye-lid.left {
      left: -5%;
      background:
        radial-gradient(ellipse at left center,
          rgba(30, 10, 50, 0.4) 0%,
          transparent 70%);
      animation: leftLidMovement 18s infinite ease-in-out;
    }

    .eye-lid.right {
      right: -5%;
      background:
        radial-gradient(ellipse at right center,
          rgba(30, 10, 50, 0.4) 0%,
          transparent 70%);
      animation: rightLidMovement 16s infinite ease-in-out;
    }

    @keyframes leftLidMovement {

      0%,
      100% {
        transform: scaleX(1);
      }

      30% {
        transform: scaleX(0.98);
      }

      60% {
        transform: scaleX(1.02);
      }
    }

    @keyframes rightLidMovement {

      0%,
      100% {
        transform: scaleX(1);
      }

      40% {
        transform: scaleX(0.97);
      }

      70% {
        transform: scaleX(1.03);
      }
    }

    .pupil-scanlines {
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(to bottom,
          transparent 0%,
          rgba(255, 255, 255, 0.05) 1%,
          transparent 2%);
      z-index: 13;
      animation: scanMove 4s infinite linear;
    }

    @keyframes scanMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 100%;
      }
    }

    .energy-particle {
      position: absolute;
      background: rgba(198, 120, 255, 0.8);
      border-radius: 50%;
      z-index: 14;
      filter: blur(1px);
      animation: floatParticle 8s infinite linear;
    }

    @keyframes floatParticle {
      0% {
        transform: translate(0, 0) scale(0.5);
        opacity: 0;
      }

      20% {
        opacity: 0.8;
      }

      80% {
        opacity: 0.8;
      }

      100% {
        transform: translate(calc(var(--end-x) - var(--start-x)),
            calc(var(--end-y) - var(--start-y))) scale(1.2);
        opacity: 0;
      }
    }

    .eye-iris {
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 30% 30%,
          rgba(255, 255, 255, 0.6) 0%,
          rgba(255, 255, 255, 0.3) 50%,
          transparent 100%);
      z-index: 5;
    }

    .eye-reflection {
      position: absolute;
      width: 25%;
      height: 25%;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      top: 20%;
      left: 20%;
      filter: blur(2px);
      z-index: 15;
      animation: reflectionMove 10s infinite ease-in-out;
    }

    @keyframes reflectionMove {

      0%,
      100% {
        transform: translate(0, 0);
        opacity: 0.8;
      }

      25% {
        transform: translate(10%, 5%);
        opacity: 0.9;
      }

      50% {
        transform: translate(-5%, 10%);
        opacity: 0.7;
      }

      75% {
        transform: translate(8%, -5%);
        opacity: 0.9;
      }
    }

    .eye-ring {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .eye-ring:nth-child(1) {
      width: 90%;
      height: 90%;
    }

    .eye-ring:nth-child(2) {
      width: 105%;
      height: 105%;
    }

    .eye-ring:nth-child(3) {
      width: 120%;
      height: 120%;
    }

    .eye-glow {
      position: absolute;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(198, 120, 255, 0.2) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      animation: glowPulse 4s infinite alternate;
    }

    @keyframes glowPulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
      }

      100% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.8;
      }
    }

    .hud-elements {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hud-circle {
      position: absolute;
      border: 1px solid var(--primary-color);
      border-radius: 50%;
      opacity: 0.4;
    }

    .hud-circle:nth-child(1) {
      width: 120%;
      height: 120%;
      top: -10%;
      left: -10%;
      animation: hudPulse 6s infinite ease-in-out;
    }

    .hud-circle:nth-child(2) {
      width: 110%;
      height: 110%;
      top: -5%;
      left: -5%;
      border-style: dashed;
      animation: hudRotate 20s infinite linear;
    }

    @keyframes hudPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.4;
      }

      50% {
        transform: scale(1.02);
        opacity: 0.8;
      }
    }

    @keyframes hudRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .status-display {
      position: absolute;
      color: var(--primary-color);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-shadow: 0 0 10px var(--primary-color);
      opacity: 0.8;
      animation: textFlicker 3s infinite alternate;
    }

    .status-display:nth-child(1) {
      top: 20px;
      left: 40px;
      font-size: 14px;
    }

    .status-display:nth-child(2) {
      bottom: 20px;
      right: 40px;
      font-size: 16px;
      animation: textFlicker 5s infinite alternate-reverse;
    }

    @keyframes textFlicker {

      0%,
      100% {
        opacity: 0.8;
        text-shadow: 0 0 10px var(--primary-color);
      }

      50% {
        opacity: 1;
        text-shadow: 0 0 15px var(--primary-color), 0 0 20px var(--accent-color);
      }
    }

    .holographic-distortion {
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at center, transparent 50%, rgba(255, 255, 255, 0.05) 100%);
      opacity: 0.3;
      animation: distortionWave 12s infinite linear;
      pointer-events: none;
    }

    @keyframes distortionWave {
      0% {
        transform: scale(1);
        opacity: 0.1;
      }

      50% {
        transform: scale(1.02);
        opacity: 0.3;
      }

      100% {
        transform: scale(1);
        opacity: 0.1;
      }
    }

    .scanlines {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom,
          transparent 0%,
          rgba(255, 255, 255, 0.05) 50%,
          transparent 100%);
      background-size: 100% 4px;
      pointer-events: none;
      animation: scanlineMove 2s infinite linear;
    }

    @keyframes scanlineMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 4px;
      }
    }

    .autofocus {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 60%, rgba(255, 255, 255, 0.1) 100%);
      animation: autofocus 8s infinite alternate;
      pointer-events: none;
    }

    @keyframes autofocus {

      0%,
      100% {
        transform: scale(1);
        opacity: 0;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.2;
      }
    }
  </style>
</head>

<body>

  <div class="particles" id="particles"></div>

  <div class="robot-container">
    <div class="robot-visor">
      <div class="circuit-pattern"></div>
      <div class="holographic-distortion"></div>
      <div class="scanlines"></div>
      <div class="autofocus"></div>

      <div class="hud-elements">
        <div class="hud-circle"></div>
        <div class="hud-circle"></div>
        <div class="status-display">SYSTEM ONLINE</div>
        <div class="status-display">NEO-VISION v3.0</div>
      </div>

      <div class="eyes-container">
        <div class="eye">
          <div class="eye-lid left"></div>
          <div class="eye-lid right"></div>
          <div class="eye-glow"></div>
          <div class="eye-ring"></div>
          <div class="eye-ring"></div>
          <div class="eye-ring"></div>
          <div class="eye-iris"></div>
          <div class="eye-pupil">
            <div class="pupil-scanlines"></div>
          </div>
          <div class="eye-reflection"></div>
        </div>

        <div class="eye">
          <div class="eye-lid left"></div>
          <div class="eye-lid right"></div>
          <div class="eye-glow"></div>
          <div class="eye-ring"></div>
          <div class="eye-ring"></div>
          <div class="eye-ring"></div>
          <div class="eye-iris"></div>
          <div class="eye-pupil">
            <div class="pupil-scanlines"></div>
          </div>
          <div class="eye-reflection"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Criar partículas flutuantes
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.width = Math.random() * 5 + 1 + 'px';
      particle.style.height = particle.style.width;
      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.top = Math.random() * 100 + 'vh';
      particle.style.animationDuration = Math.random() * 10 + 10 + 's';
      particle.style.animationDelay = Math.random() * 5 + 's';
      particlesContainer.appendChild(particle);
    }

    // Criar partículas de energia nos olhos
    document.querySelectorAll('.eye-pupil').forEach(pupil => {
      for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.classList.add('energy-particle');

        const startX = Math.random() * 80 - 40;
        const startY = Math.random() * 80 - 40;
        const endX = Math.random() * 160 - 80;
        const endY = Math.random() * 160 - 80;

        particle.style.setProperty('--start-x', startX + '%');
        particle.style.setProperty('--start-y', startY + '%');
        particle.style.setProperty('--end-x', endX + '%');
        particle.style.setProperty('--end-y', endY + '%');

        particle.style.left = '50%';
        particle.style.top = '50%';
        particle.style.width = Math.random() * 5 + 2 + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDelay = Math.random() * 5 + 's';
        particle.style.animationDuration = Math.random() * 5 + 5 + 's';

        pupil.appendChild(particle);
      }
    });

    // Efeito de glitch aleatório
    const visor = document.querySelector('.robot-visor');
    setInterval(() => {
      if (Math.random() > 0.9) {
        visor.style.filter = 'drop-shadow(0 0 30px rgba(255, 255, 255, 0.3)) hue-rotate(' + (Math.random() * 60 - 30) + 'deg)';
        setTimeout(() => {
          visor.style.filter = 'drop-shadow(0 0 30px rgba(255, 255, 255, 0.3))';
        }, 100);
      }
    }, 3000);
  </script>
</body>

</html>
